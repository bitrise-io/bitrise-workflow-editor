  update-launchdarkly:
    inputs:
      - LD_PROJECT_KEY: website
        opts:
          is_expand: false
      - LD_FLAG_KEY: workflow-editor-version
        opts:
          is_expand: false
      - DD_FLAG_KEY: workflow-editor-version
        opts:
          is_expand: false
      - DD_SITE: datadoghq.com
        opts:
          is_expand: false
    steps:
      - nvm@1:
          inputs:
            - node_version: "20"
      - script@1:
          inputs:
            - script_file_path: null
            - runner_bin: node
            - content: |-
                const [newValue, fallbackValue] = process.env.NPM_PACKAGE_VERSION.split(':');

                if (!newValue.match(/^\d+\.\d+\.\d+$/)) throw new Error(`Invalid WFE Current version: ${newValue}`);

                if (fallbackValue && !fallbackValue.match(/^\d+\.\d+\.\d+$/)) throw new Error(`Invalid WFE Fallback version: ${newValue}`);

                // Mirrors the LD update above so Datadog's copy of this flag (migrated from LD)
                // doesn't drift while both systems are maintained in parallel. Opt-in via
                // DD_FLAG_KEY (blank = skip) so other callers of this bundle, e.g.
                // update-launchdarkly-manual against the throwaway 'api-testing' LD flag,
                // are unaffected. Any failure here throws and fails the build, same as an LD
                // failure would -- Datadog is now a required half of this release step, not
                // a best-effort side sync.
                async function updateDatadog() {
                  const DD_FLAG_KEY = process.env.DD_FLAG_KEY;
                  if (!DD_FLAG_KEY) {
                    console.log('DD_FLAG_KEY not set; skipping Datadog variant sync.');
                    return;
                  }

                  const DD_SITE = process.env.DD_SITE || 'datadoghq.com';
                  const headers = {
                    'DD-API-KEY': process.env.DD_API_KEY,
                    'DD-APPLICATION-KEY': process.env.DD_APP_KEY,
                    'Content-Type': 'application/json',
                  };

                  // res.json() throws an opaque "Unexpected end of JSON input" on any empty or
                  // non-JSON body -- including error responses -- which hides the actual status
                  // code right when it matters most. Read as text first so a failure always
                  // reports what Datadog actually sent back.
                  async function readBody(res) {
                    const text = await res.text();
                    if (!text) return {};
                    try {
                      return JSON.parse(text);
                    } catch (e) {
                      throw new Error(`non-JSON response body (status ${res.status}): ${text.slice(0, 500)}`);
                    }
                  }

                  const searchUrl = `https://api.${DD_SITE}/api/v2/feature-flags?key=${encodeURIComponent(DD_FLAG_KEY)}&limit=100`;
                  const searchRes = await fetch(searchUrl, { headers });
                  const searchData = await readBody(searchRes);
                  if (!searchRes.ok) throw new Error(`Datadog flag search failed (${searchRes.status}): ${JSON.stringify(searchData)}`);

                  const flag = (searchData.data || []).find(f => f.attributes.key === DD_FLAG_KEY);
                  if (!flag) throw new Error(`No Datadog flag found with key '${DD_FLAG_KEY}'`);

                  const variants = flag.attributes.variants || [];
                  // Matched by name first, same as the LD lookup above -- the LD -> Datadog
                  // migration carried each LD variation's `name` over verbatim, so
                  // 'Current'/'Fallback' should exist there too; the key fallback covers a
                  // flag whose variant names weren't migrated for some reason.
                  let currentVariant = variants.find(v => v.name === 'Current') || variants.find(v => v.key === 'current');
                  let fallbackVariant = variants.find(v => v.name === 'Fallback') || variants.find(v => v.key === 'fallback');

                  const others = variants.filter(v => v !== currentVariant && v !== fallbackVariant);
                  if (others.length) {
                    console.log(`Note: flag '${DD_FLAG_KEY}' also has ${others.length} other variant(s) not managed by this sync (left untouched): ${others.map(v => `${v.name || v.key}=${v.value}`).join(', ')}`);
                  }

                  async function createVariant(key, name, value) {
                    const url = `https://api.${DD_SITE}/api/v2/feature-flags/${flag.id}/variants`;
                    const res = await fetch(url, {
                      method: 'POST',
                      headers,
                      body: JSON.stringify({ data: { type: 'variants', attributes: { key, name, value } } }),
                    });
                    const body = await readBody(res);
                    if (!res.ok) throw new Error(`Datadog variant creation failed (${res.status}) for '${name}': ${JSON.stringify(body)}`);
                    console.log(`Datadog variant '${name}' created (id=${body.data.id}) with value '${value}'.`);
                    // The create response nests key/name/value under data.attributes, unlike the
                    // flat {id,key,name,value} shape the search endpoint returns each variant in
                    // (and that the rest of this function assumes) -- flatten it to match.
                    return { id: body.data.id, ...body.data.attributes };
                  }

                  // Additive-only, same as the Datadog endpoint itself: create whichever of
                  // Current/Fallback is missing rather than failing outright. Any OTHER
                  // pre-existing variant (e.g. a stray one from an earlier migration) is left
                  // exactly as-is -- this never renames, repurposes, or deletes a variant.
                  let createdCurrent = false;
                  let createdFallback = false;
                  if (!currentVariant) {
                    currentVariant = await createVariant('current', 'Current', newValue);
                    createdCurrent = true;
                  }
                  if (!fallbackVariant) {
                    const baseline = fallbackValue || currentVariant.value;
                    fallbackVariant = await createVariant('fallback', 'Fallback', baseline);
                    createdFallback = true;
                  }

                  const oldCurrentValue = currentVariant.value;

                  async function updateVariant(variant, value) {
                    const url = `https://api.${DD_SITE}/api/v2/feature-flags/${flag.id}/variants/${variant.id}`;
                    const res = await fetch(url, {
                      method: 'PUT',
                      headers,
                      body: JSON.stringify({ data: { type: 'variants', attributes: { value } } }),
                    });
                    const body = await readBody(res);
                    if (res.status === 201) {
                      console.warn(`Datadog variant '${variant.name || variant.key}' update queued as a pending approval suggestion (id=${body.data && body.data.id}); not applied immediately.`);
                    } else if (!res.ok) {
                      throw new Error(`Datadog variant update failed (${res.status}) for '${variant.name || variant.key}': ${JSON.stringify(body)}`);
                    } else {
                      console.log(`Datadog variant '${variant.name || variant.key}' updated to '${value}'.`);
                    }
                  }

                  // Skip the redundant PUT for a variant we just created with the right value.
                  if (!createdCurrent) await updateVariant(currentVariant, newValue);
                  if (!createdFallback) await updateVariant(fallbackVariant, fallbackValue || oldCurrentValue);
                }

                (async () => {
                  await updateDatadog();
                })();
          title: WFE Version Update
    title: Update the WFE version numbers in Launchdarkly
  upload-source-maps:
    steps:
      - script:
          inputs:
            - content: |-
                #!/bin/bash

                echo 'Uploading sourcemap to DataDog...'
                export DATADOG_API_KEY=$DATADOG_API_KEY_FOR_SOURCEMAPS
                npx --yes @datadog/datadog-ci sourcemaps upload build/assets --service=wfe --release-version="$WFE_VERSION" --minified-path-prefix=/workflow_editor/$WFE_VERSION/assets --disable-git
          title: Upload sourcemaps to DataDog
    title: Upload sourcemaps to DataDog
