<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bitrise Workflow Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <base href="/" target="_parent" />
  <link href="/images/favicons/favicon.ico" rel="icon" sizes="32x32" crossorigin="anonymous" />
  <link href="/images/favicons/apple-touch-icon.png" rel="apple-touch-icon" crossorigin="anonymous" />
  <script>
    window.env = {
      MODE: "%MODE%",
      CLARITY: "%CLARITY%",
      DATADOG_RUM: "%DATADOG_RUM%",
      NODE_ENV: "%NODE_ENV%",
      PUBLIC_URL_ROOT: "%PUBLIC_URL_ROOT%",
      WFE_VERSION: "%WFE_VERSION%",
    };
  </script>
  <script>
    // Bitkit dark mode. On the website the editor is a same-origin iframe, and the page around it has already
    // checked the enable-dark-mode flag and the bitkitColorMode preference and put the result on its <html>, so
    // copying that class and color-scheme is all the editor does. It runs before the first paint so the editor
    // doesn't flash light, and follows the page when the user switches modes or System mode follows the OS.
    // The CLI has no page around it and stays light.
    (function () {
      var root = document.documentElement;
      var pageRoot;
      try {
        if (window.parent === window) return;
        pageRoot = window.parent.document.documentElement;
      } catch (e) {
        return;
      }
      var apply = function () {
        root.classList.toggle('dark', pageRoot.classList.contains('dark'));
        root.classList.toggle('light', pageRoot.classList.contains('light'));
        root.style.colorScheme = pageRoot.style.colorScheme;
      };
      apply();
      new MutationObserver(apply).observe(pageRoot, { attributes: true, attributeFilter: ['class', 'style'] });
    })();
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/javascripts/main.tsx"></script>
</body>

</html>
